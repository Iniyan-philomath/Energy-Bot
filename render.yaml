# Existing manually-created services must use these same settings in Render.
# Adding a Blueprint file alone does not reconfigure an existing service.
services:
  - type: web
    name: Energy-Bot
    runtime: static
    repo: https://github.com/Iniyan-philomath/Energy-Bot
    branch: main
    rootDir: energy-bot-app
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
    headers:
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /deployment.json
        name: Cache-Control
        value: no-store
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
